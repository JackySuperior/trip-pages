<style>
:root{
  --bg:#fbf6ee; --bg2:#f3eadb; --card:#ffffff; --ink:#2a2233; --ink2:#6b6177; --line:#e7dccb;
  --accent:#d9731f; --accent2:#b8421d; --gold:#e8a93a; --glow:rgba(232,169,58,.35);
  --red:#c2412d; --red-bg:#fbe9e5; --yellow:#a86b00; --yellow-bg:#fdf3dc; --info:#3d6b8f; --info-bg:#e8f0f6;
  --now:#fff4dc; --hero1:#2b1d4f; --hero2:#5a2d4e; --hero-ink:#fff7ea;
  --shadow:0 1px 2px rgba(42,34,51,.06),0 6px 20px rgba(42,34,51,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14112b; --bg2:#1c1838; --card:#221d42; --ink:#f4ecdf; --ink2:#b4a9c6; --line:#352e5c;
    --accent:#f0953f; --accent2:#ffb15c; --gold:#f5c060; --glow:rgba(245,192,96,.28);
    --red:#ff8a73; --red-bg:#3a1f2c; --yellow:#f5c060; --yellow-bg:#352a1c; --info:#8fbbe0; --info-bg:#1d2b45;
    --now:#3a2d26; --hero1:#0d0a20; --hero2:#3a1d3f; --hero-ink:#fff7ea;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14112b; --bg2:#1c1838; --card:#221d42; --ink:#f4ecdf; --ink2:#b4a9c6; --line:#352e5c;
  --accent:#f0953f; --accent2:#ffb15c; --gold:#f5c060; --glow:rgba(245,192,96,.28);
  --red:#ff8a73; --red-bg:#3a1f2c; --yellow:#f5c060; --yellow-bg:#352a1c; --info:#8fbbe0; --info-bg:#1d2b45;
  --now:#3a2d26; --hero1:#0d0a20; --hero2:#3a1d3f; --hero-ink:#fff7ea;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
a{color:var(--accent2)}
code{font-size:.9em;background:var(--bg2);padding:1px 5px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);background:radial-gradient(120% 90% at 50% 0%,var(--hero2),var(--hero1) 70%);padding:44px 0 34px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1.15;margin:0 0 6px;letter-spacing:.04em;position:relative;z-index:1}
.hero .sub{opacity:.85;margin:0;position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:14px}
.chip.count{background:var(--gold);color:#2a1a00;border:none;font-weight:700}
.lantern{position:absolute;bottom:-60px;width:var(--s,22px);height:calc(var(--s,22px)*1.3);border-radius:40% 40% 30% 30%;
  background:radial-gradient(circle at 50% 70%,#fff2c2,#f6a540 45%,#c85a1c 100%);box-shadow:0 0 18px 6px rgba(246,165,64,.45);
  opacity:.9;animation:rise var(--d,18s) linear infinite;animation-delay:var(--delay,0s);left:var(--x,50%)}
.lantern::after{content:"";position:absolute;left:30%;right:30%;bottom:-3px;height:4px;border-radius:2px;background:#ffd98a;filter:blur(1px)}
@keyframes rise{0%{transform:translateY(0) translateX(0) rotate(-3deg);opacity:0}10%{opacity:.9}50%{transform:translateY(-55vh) translateX(14px) rotate(3deg)}100%{transform:translateY(-110vh) translateX(-10px) rotate(-2deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.lantern{animation:none;opacity:.55;bottom:auto;top:var(--y,30%)}}

/* now card */
.now{margin:-20px auto 0;position:relative;z-index:2}
.now .box{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;border:1px solid var(--line)}
.now h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--accent)}
.now .row{display:flex;gap:10px;align-items:baseline}
.now .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px}
.now .lbl{font-size:12px;color:var(--ink2);min-width:48px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:18px}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;font:inherit;font-size:14px;line-height:1.25;cursor:pointer;text-align:center}
.tab small{display:block;font-size:11px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab.today{box-shadow:0 0 0 2px var(--gold)}

main{padding:18px 0 40px}
.panel[hidden]{display:none}
h2.dh{font-family:"Noto Serif TC",serif;font-size:24px;margin:6px 0 4px;line-height:1.35}
.dmeta{color:var(--ink2);font-size:14px;margin:0 0 12px}
.callout{background:var(--bg2);border-left:3px solid var(--gold);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14.5px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin:14px 0}
section.card>h3{margin:0 0 10px;font-size:17px}

/* timeline */
.tl{list-style:none;margin:16px 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:69px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:58px 1fr;gap:20px;padding:10px 0}
.tl .time{font-variant-numeric:tabular-nums;font-size:13px;line-height:1.3;color:var(--ink2);text-align:right;padding-top:3px}
.tl .time b{display:block;font-size:15px;color:var(--ink)}
.tl .dot{position:absolute;left:62px;top:13px;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:9px}
.tl li.lock .dot{border-color:var(--accent);background:var(--accent)}
.tl li.limit .dot{border-color:var(--gold)}
.tl .body{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tl .ic{font-size:18px;margin-right:4px}
.tl .cost{display:inline-block;margin-top:6px;font-size:13px;color:var(--ink2);background:var(--bg2);padding:1px 8px;border-radius:999px}
.tl li.lock .body{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tl li.current .body{background:var(--now);box-shadow:0 0 0 2px var(--gold),0 0 24px var(--glow)}
.tl li.past{opacity:.55}
.body a.navbtn{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:13px;font-weight:500;background:var(--accent);color:#fff;padding:2px 10px;border-radius:999px;margin:2px 0;white-space:nowrap}
.body a.place{font-weight:700;text-decoration:none;border-bottom:1px dashed currentColor}
.body a.place::before{content:"📍";margin-right:2px;font-size:.85em}

/* details */
details{border-top:1px solid var(--line);padding:6px 0}
details:first-of-type{border-top:none}
summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--accent)}
details[open] summary::after{content:"－"}
details h4{margin:12px 0 4px;font-size:15px}
details ul{margin:4px 0 8px;padding-left:20px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:500;font-size:13px}

/* overview */
.days{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.dcard .d{font-family:"Noto Serif TC",serif;text-align:center;line-height:1.1}
.dcard .d b{display:block;font-size:24px;color:var(--accent)}
.dcard .d span{font-size:12px;color:var(--ink2)}
.dcard .who{font-size:12px;color:var(--ink2)}
.dcard .main{font-size:14.5px}
.check h4{margin:14px 0 6px;font-size:14px;display:inline-block;padding:2px 10px;border-radius:999px}
.check .red h4{background:var(--red-bg);color:var(--red)}
.check .yellow h4{background:var(--yellow-bg);color:var(--yellow)}
.check .info h4{background:var(--info-bg);color:var(--info)}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
.check label.done span{text-decoration:line-through;color:var(--ink2)}
footer{color:var(--ink2);font-size:13px;text-align:center;padding:24px 16px 40px}
.themebtn{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.14);color:var(--hero-ink);border:1px solid rgba(255,255,255,.25);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer}
</style>
</head>

ing+Center+Chiang+Mai&amp;amp;destination=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley＋毛毛回 Arise（約 25 分）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=MAYA+Lifestyle+Shopping+Center+Chiang+Mai&amp;amp;destination=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~120–200 THB／車"}], "sections": [{"title": "細節", "html": "<h4>Khao Soi Islam<\/h4><ul><li>📍 地址：24 Charoen Prathet Rd Soi 1, Chang Khlan, Chiang Mai（夜市一帶）<\/li><li>🕘 營業：每天約 07:30–17:00（<a href=\"https://www.visitthailandtoday.com/restaurants/chiang-mai/khao-soi-islam\" target=\"_blank\" rel=\"noopener\">Visit Thailand Today<\/a>、<a href=\"https://www.austinbushphotography.com/blog/blog/khao-soi-islam%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%8B%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%B4%E0%B8%AA%E0%B8%A5%E0%B8%B2%E0%B8%A1.html\" target=\"_blank\" rel=\"noopener\">Austin Bush<\/a>，查證 2026-11-18）<\/li><li>💡 清真餐廳，不賣豬肉；雅雅組剛下飛機，吃這家可以順便先體驗清邁的咖哩麵<\/li><\/ul><h4>CAD 天燈節（主辦單位提供給自由行旅客的說明）<\/h4><ul><li>會場：CAD Cultural Center，Ban Sa Ha Khon, Mae On；從 CMECC 開車約 40 分<\/li><li>Standard 票：4,900（後排區）、雙條車或巴士接送、Standard 用餐區<\/li><li>官方接駁：13:00–14:30 從 CMECC（700 週年體育場旁）出發；我們自己去，所以不搭<\/li><li>回程接駁：<strong>21:00 和 23:00 兩班<\/strong>，主辦單位寫「保證每位賓客都有回程車」，下車點可選 MAYA 或 CMECC<\/li><li>禁止攜帶：寵物、外食飲料、空拍機、酒、自己的天燈或煙火；包包要過安檢<\/li><li>8 歲以下兒童陪同入場免費<\/li><\/ul>"}, {"title": "交通方案比較（為什麼選 B）", "html": "<div class='tbl'><table><thead><tr><th>方案<\/th><th>評估<\/th><\/tr><\/thead><tbody><tr><td>A. 全程坐官方接駁<\/td><td>13:00–14:30 要在 CMECC 排隊曬太陽，評論說可能排超過 1 小時<\/td><\/tr><tr><td><strong>B. 去程 Grab，回程坐接駁 ✅ 使用者選擇<\/strong><\/td><td>4 人分攤一台車，去程舒服；回程有官方保證的班次<\/td><\/tr><tr><td>C. 包車來回<\/td><td>最穩，但要另外付包車費<\/td><\/tr><tr><td>D. 全程 Grab<\/td><td>❌ 散場後幾乎叫不到車，等 2 小時以上很常見<\/td><\/tr><\/tbody><\/table><\/div><p>⚠️ <strong>方案 B 的唯一風險<\/strong>：主辦單位的說明寫到，接駁上下車點「不適用於 Own Transportation（自行前往）的票」。你們買的是含接駁的 Standard 票，照理說可以搭回程，但<strong>一定要先問賣票的人<\/strong>：「去程自己過去的話，回程還能不能坐接駁？」如果不行，就改成方案 C。<\/p>"}, {"title": "雨天／太累的備案", "html": "<ul><li>天燈節照常舉辦（日期是依陰曆訂的）。如果下雨，帶輕便雨衣，不要帶傘（人很多）<\/li><li>如果雅雅組的班機延誤超過 1 小時：直接從機場叫 Grab 到會場，Kingsley 和毛毛先去報到。報到時間到 17:00 為止<\/li><\/ul>"}, {"title": "今日花費（每人）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>午餐<\/td><td>~80–150 THB<\/td><\/tr><tr><td>去程 Grab（4 人分攤）<\/td><td>~165–225 THB<\/td><\/tr><tr><td>回程 Grab<\/td><td>~60–200 THB<\/td><\/tr><tr><td>機場到住宿（雅雅組 2 人分攤）<\/td><td>~50–90 THB<\/td><\/tr><tr><td>CAD 門票、晚餐、回程接駁<\/td><td>已付<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~350–670 THB／人<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源", "html": "<ul><li>CAD 官方自由行說明（流程、接駁、規則）：<a href=\"https://faceticket.net/en/manual/guide-for-fit-cad-khomloy-sky-lantern-festival-24-25-november-2026/\" target=\"_blank\" rel=\"noopener\">faceticket<\/a>（查證 2026-11-18）<\/li><li>回程下車點、散場後叫不到車：<a href=\"https://www.chiangmaiyipengfestival.com/faq\" target=\"_blank\" rel=\"noopener\">chiangmaiyipengfestival FAQ<\/a>（售票商）<\/li><li>Standard 接駁的實際評論、Grab 約 665 THB：<a href=\"https://www.tripadvisor.com/AttractionProductReview-g1450344-d32962994-Official_Ticket_2026_Chiang_Mai_CAD_Khomloy_Sky_Lantern_Festival-Mae_On.html\" target=\"_blank\" rel=\"noopener\">Tripadvisor<\/a><\/li><li>會場地址：<a href=\"https://www.outgoing.world/activity/649e3480-60d8-463e-b116-1d29fa3308d2\" target=\"_blank\" rel=\"noopener\">outgoing.world<\/a><\/li><li>CMECC 位置：<a href=\"https://en.wikipedia.org/wiki/Chiang_Mai_International_Exhibition_and_Convention_Centre\" target=\"_blank\" rel=\"noopener\">Wikipedia<\/a><\/li><\/ul>"}]}, {"n": 3, "date": "2026-11-26", "label": "11/26", "dow": "四", "title": "清邁西邊：童話花園、藝術村、森林寺廟（Kingsley、雅雅、小玹）", "notes": ["動線：各自住宿 → 12:00 在 Chom Cafe 會合吃午餐 → 清邁藝術村 → 悟孟寺 → 寧曼路 → Kiat Niyom（晚餐）→ 回住宿", "今天的節奏：早上睡飽，<strong>中午才碰面<\/strong>。明天 08:00 要包車，晚上早點回去", "👗 悟孟寺是佛寺，要穿過膝、有袖的衣服"], "rows": [{"time": "〜1  "走到悟孟寺，就在旁邊（地圖上看約 10 分，估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Baan+Kang+Wat+Chiang+Mai&amp;amp;destination=Wat+Umong+Suan+Phutthatham+Chiang+Mai&amp;amp;travelmode=walking\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": ""}, {"time": "16:00–16:45", "start": "16:00", "end": "16:45", "icon": "⏰", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Umong+Suan+Phutthatham+Suthep+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">悟孟寺 Wat Umong Suan Phutthatham<\/a> — 素帖山腳的森林寺廟，有 700 年歷史的磚造地道，池塘邊可以餵魚。傍晚光線很好拍；關門時間說法不一，最早可能 17:00 就關", "cost": "免費或 20 THB"}, {"time": "16:45–17:05", "start": "16:45", "end": "17:05", "icon": "🚕", "html": "3 人一台 Grab → 寧曼路，門到門約 20 分 · <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Wat+Umong+Suan+Phutthatham+Chiang+Mai&amp;amp;destination=One+Nimman+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–120 THB／車"}, {"time": "17:05–17:45", "start": "17:05", "end": "17:45", "icon": "🎯", "html": "寧曼路散步：<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=One+Nimman+Nimmanahaeminda+Rd+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">One Nimman<\/a> 和巷子裡的小店（週四沒有市集，只是先逛逛）", "cost": ""}, {"time": "17:45–19:15", "start": "17:45", "end": "19:15", "icon": "🍜", "html": "晚餐：<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Kiat+Niyom+Local+Thai+Food+23+Siri+Mangkalajarn+Rd+Lane+13+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">Kiat Niyom เกียรตินิยม<\/a> — 寧曼 13 巷的在地泰國菜餐廳，有活海鮮水族箱。主打<strong>脆皮豬肉、辣拌鮭魚沙拉、金蛋沙拉、女婿蛋（炸蛋淋羅望子醬）<\/strong>", "cost": "~300–500 THB／人"}, {"time": "19:15–19:45", "start": "19:15", "end": "19:45", "icon": "🚕", "html": "各自回住宿。明天 08:00 包車出發，早點睡 · 雅雅組 <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Kiat+Niyom+Local+Thai+Food+23+Siri+Mangkalajarn+Rd+Lane+13+Chiang+Mai&amp;amp;destination=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Kiat+Niyom+Local+Thai+Food+23+Siri+Mangkalajarn+Rd+Lane+13+Chiang+Mai&amp;amp;destination=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~100–200 THB／車"}], "sections": [{"title": "細節", "html": "<h4>悟孟寺 Wat Umong Suan Phutthatham<\/h4><ul><li>📍 素帖山腳，古城西邊。⚠️ 古城裡有另一間同名的 Wat Umong Mahathera Chan，叫車時要選 <strong>Suan Phutthatham<\/strong><\/li><li>🕘 開放時間：約 06:00 開門，關門時間說法不一（17:00–20:00）<\/li><li>🎫 門票：多數來源寫免費（自由捐獻），也有來源寫外國人 20 THB<\/li><\/ul><h4>清邁藝術村 Baan Kang Wat<\/h4><ul><li>📍 191-197 Soi Wat Umong, Suthep<\/li><li>🕘 週二至週日，約 10:00–18:00（有來源寫 11:00 才開）；<strong>週一休<\/strong><\/li><li>💡 店家各自有營業時間，週間有些攤位可能沒開；週日早上有藝術家市集<\/li><\/ul><h4>Chom Cafe and Restaurant<\/h4><ul><li>📍 2/13 Moo 2 Somphot Chiang Mai 700 Pi Rd, Mae Hia<\/li><li>🕘 每天 11:00 開門，到 22:00（也有來源寫 24:00）<\/li><li>☎ 053 271 749<\/li><li>🎫 訂位：查不到訂位規定；週四中午人應該不會太多，不放心的話可以前一天打電話<\/li><li>💡 噴霧時段最好拍照；園區很大，穿好走的鞋<\/li><\/ul><h4>Kiat Niyom（เกียรตินิยม，Local Thai Food）<\/h4><ul><li>📍 23 Siri Mangkalajarn Rd Lane 13（寧曼 13 巷）, Su Thep<\/li><li>🕘 每天 10:30–21:30<\/li><li>☎ +66 62 423 4664；Chope 可以線上訂位<\/li><li>🍽️ 在地泰國菜，海鮮現撈；每人約 500 THB 以內<\/li><\/ul>"}, {"title": "雨天／太累的備案", "html": "<ul><li>下雨的話，悟孟寺可以只看地道，藝術村大部分是有屋簷的小店<\/li><li>太累的話，把悟孟寺或寧曼路拿掉，逛完藝術村就直接去吃晚餐<\/li><\/ul>"}, {"title": "今日花費（每人，3 人分攤車資）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>交通（Grab 約 5 趟）<\/td><td>~200–350 THB<\/td><\/tr><tr><td>悟孟寺<\/td><td>0–20 THB<\/td><\/tr><tr><td>午餐 Chom Cafe<\/td><td>~300–600 THB<\/td><\/tr><tr><td>晚餐 Kiat Niyom<\/td><td>~300–500 THB<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~800–1,470 THB／人＋藝術村購物<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源（查證 2026-11-18）", "html": "<ul><li>悟孟寺：<a href=\"https://www.thaiholidayguide.com/attraction/wat-umong/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://audiala.com/en/thailand/chiang-mai/wat-umong-suan-phutthatham/\" target=\"_blank\" rel=\"noopener\">audiala<\/a><\/li><li>清邁藝術村：<a href=\"https://www.timeout.com/chiang-mai/attractions/baan-kang-wat\" target=\"_blank\" rel=\"noopener\">Time Out<\/a>、<a href=\"https://www.visitthailandtoday.com/markets-shopping/chiang-mai/baan-kang-wat\" target=\"_blank\" rel=\"noopener\">visitthailandtoday<\/a>、<a href=\"https://www.nomadotravel.app/en/attractions/baan-kang-wat\" target=\"_blank\" rel=\"noopener\">nomadotravel<\/a><\/li><li>Chom Cafe：<a href=\"https://www.chiangmailocator.com/chiang-mai-restaurants-7489:chom-cafe-and-restaurant\" target=\"_blank\" rel=\"noopener\">chiangmailocator<\/a>、<a href=\"https://wanderlog.com/place/details/730850/chom-cafe-and-restaurant\" target=\"_blank\" rel=\"noopener\">wanderlog<\/a>、<a href=\"https://thesmartlocal.com/thailand/chom-cafe-and-restaurant\" target=\"_blank\" rel=\"noopener\">TheSmartLocal<\/a><\/li><li>Kiat Niyom：<a href=\"https://www.chope.co/bangkok-restaurants/restaurant/kiat-ni-yom-local-thai-food-bar-chiang-mai\" target=\"_blank\" rel=\"noopener\">Chope<\/a>、<a href=\"https://wanderlog.com/place/details/10622889\" target=\"_blank\" rel=\"noopener\">wanderlog<\/a>、<a href=\"https://mindtrip.ai/restaurant/su-thep-chiang-mai/kiat-niyom-local-thai-food/re-AkGqKouK\" target=\"_blank\" rel=\"noopener\">mindtrip<\/a><\/li><\/ul>"}]}, {"n": 4, "date": "2026-11-27", "label": "11/27", "dow": "五", "title": "清萊包車一日：溫泉、長頸族、白廟、藍廟、黑屋、觀音寺（4 人：Kingsley、毛毛、雅雅、小玹）", "notes": ["動線：Astra → Arise →（往北走 118 號公路）Mae Khachan 溫泉 → 長頸族村 → 白廟 → 午餐 → 藍廟 → 黑屋 → Lalita Cafe → 觀音寺 Wat Huai Pla Kang → 回清邁", "🔴 <strong>順序調整建議<\/strong>：司機原本把黑屋排在最後，但<strong>黑屋 17:00 就關門<\/strong>，照原順序到的時候已經關了。建議請司機改成「藍廟 → 黑屋 → Lalita Cafe → 觀音寺」（觀音寺開到晚上 21:00 左右，最適合放最後）", "👗 整天都要穿<strong>過膝、有袖<\/strong>的衣服（白廟會檢查服裝）；帶現金（各景點門票都收現金）、行動電源、腳泡溫泉用的小毛巾"], "rows": [{"time": "08:00", "start": "08:00", "end": null, "icon": "🔒", "html": "🚐 包車出發。建議先接 Astra（雅雅組），再接 Arise（Kingsley＋毛毛），因為 Arise 在城東，比較順往北的路（⚠️ 上車順序和時間要和司機確認）", "cost": "包車費（已談）"}, {"time": "08:20–09:30", "start": "08:20", "end": "09:30", "icon": "🚐", "html": "Arise → Mae Khachan 溫泉，約 1 小時 10 分", "cost": ""}, {"time": "09:30–10:00", "start": "09:30", "end": "10:00", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Mae+Khachan+Hot+Spring+Wiang+Pa+Pao+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">Mae Khachan 溫泉<\/a> — 118 號公路旁的休息站，可以泡腳、買溫泉蛋", "cost": "免費（也有來源寫 100 THB）"}, {"time": "10:00–10:45", "start": "10:00", "end": "10:45", "icon": "🎯", "html": "長頸族村（司機帶路，確切地點以司機為準）", "cost": "~280–300 THB"}, {"time": "10:45–12:25", "start": "10:45", "end": "12:25", "icon": "🚐", "html": "往白廟，約 1 小時 40 分", "cost": ""}, {"time": "12:25–13:30", "start": "12:25", "end": "13:30", "icon": "⏰", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Rong+Khun+White+Temple+Pa+O+Don+Chai+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">白廟 Wat Rong Khun<\/a> — 全白的現代寺廟，主殿要脫鞋、殿內禁止拍照", "cost": "<strong>200 THB<\/strong>（2026 年起調漲）"}, {"time": "13:30–14:15", "start": "13:30", "end": "14:15", "icon": "🍜", "html": "午餐：<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Lanmanee+Food+Court+Wat+Rong+Khun+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">Lanmanee Food Court<\/a> — 就在白廟停車場旁邊，選擇多、價格平實（營業時間查不到，⚠️ 現場確認）", "cost": "~80–200 THB"}, {"time": "14:15–14:35", "start": "14:15", "end": "14:35", "icon": "🚐", "html": "往藍廟，約 20 分", "cost": ""}, {"time": "14:35–15:15", "start": "14:35", "end": "15:15", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Rong+Suea+Ten+Rim+Kok+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">藍廟 Wat Rong Suea Ten<\/a> — 寶藍色的寺廟，裡面有白色大佛", "cost": "免費（隨喜捐獻）"}, {"time": "15:15–15:40", "start": "15:15", "end": "15:40", "icon": "🚐", "html": "往黑屋，約 25 分（估計）", "cost": ""}, {"time": "15:40–16:45", "start": "15:40", "end": "16:45", "icon": "⏰", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Baan+Dam+Museum+Nang+Lae+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">黑屋 Baan Dam<\/a> — 藝術家 Thawan Duchanee 的黑色建築群，偏暗黑風格的藝術收藏。<strong>17:00 關門<\/strong>", "cost": "80 THB"}, {"time": "16:45–17:05", "start": "16:45", "end": "17:05", "icon": "🚐", "html": "往 Lalita Cafe，約 20 分（估計）", "cost": ""}, {"time": "17:05–17:50", "start": "17:05", "end": "17:50", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Lalitta+Cafe+392+Rim+Kok+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">Lalita Cafe<\/a> — 童話森林風格的花園咖啡廳，趁天還亮的時候拍照", "cost": "飲料 ~100–200 THB"}, {"time": "17:50–18:10", "start": "17:50", "end": "18:10", "icon": "🚐", "html": "往觀音寺，約 20 分（估計）", "cost": ""}, {"time": "18:10–18:50", "start": "18:10", "end": "18:50", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Huay+Pla+Kang+Rim+Kok+Chiang+Rai\" target=\"_blank\" rel=\"noopener\">觀音寺 Wat Huai Pla Kang<\/a> — 25 層樓高的白色觀音像，可以搭電梯上去看清萊市區夜景；寺廟有點燈", "cost": "寺廟免費；電梯 ~40 THB"}, {"time": "18:50–19:40", "start": "18:50", "end": "19:40", "icon": "🍽️", "html": "晚餐：⚠️ 待定，可以請司機推薦清萊市區或回程路上的餐廳", "cost": "~150–300 THB"}, {"time": "19:40–22:40", "start": "19:40", "end": "22:40", "icon": "🚐", "html": "回清邁，約 3 小時（Google 估計 2 小時 50 分～3 小時 10 分）。先送 Arise 再送 Astra，或照司機安排", "cost": ""}], "sections": [{"title": "細節", "html": "<h4>白廟 Wat Rong Khun<\/h4><ul><li>🕘 每天約 08:00–17:30，最後入場約 17:00（也有來源寫 16:30）<\/li><li>🎫 外國人 200 THB（含藝術洞穴），只收現場付款，建議帶現金；70 歲以上和身高 120 cm 以下的兒童免費<\/li><li>💡 中午是旅行團最多的時段，人會比較多<\/li><\/ul><h4>藍廟 Wat Rong Suea Ten<\/h4><ul><li>🕘 每天約 07:00–20:00；免費<\/li><\/ul><h4>黑屋 Baan Dam<\/h4><ul><li>🕘 每天 09:00–17:00，<strong>12:00–13:00 售票處午休<\/strong><\/li><li>🎫 80 THB；建議至少 15:00 前到，才有時間逛完<\/li><\/ul><h4>Lalita Cafe（Lalitta Café）<\/h4><ul><li>📍 392 Rim Kok, Mueang Chiang Rai<\/li><li>🕘 每天約 08:00–20:00（也有來源寫 19:30 關）<\/li><li>☎ +66 82 190 1758<\/li><\/ul><h4>觀音寺 Wat Huai Pla Kang<\/h4><ul><li>🕘 每天約 07:00–21:00（也有來源寫 21:30 或 20:00）；電梯營業時間不確定<\/li><li>🎫 寺廟免費；觀音像電梯約 40 THB（也有來源寫 50 THB），上到 24–25 樓<\/li><\/ul><h4>長頸族村<\/h4><ul><li>💡 有些旅客認為這類村落有把人當觀光展示的爭議。去的話，用買手工藝品的方式支持村民，拍照前先問<\/li><\/ul>"}, {"title": "雨天／太累的備案", "html": "<ul><li>太累的話，可以拿掉長頸族村或 Lalita Cafe，大約可以提早 1 小時回到清邁<\/li><li>下雨的話，白廟和黑屋大多是戶外步道，帶輕便雨衣<\/li><\/ul>"}, {"title": "今日花費（每人，不含包車費）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>溫泉<\/td><td>0–100 THB<\/td><\/tr><tr><td>長頸族村<\/td><td>~280–300 THB<\/td><\/tr><tr><td>白廟<\/td><td>200 THB<\/td><\/tr><tr><td>黑屋<\/td><td>80 THB<\/td><\/tr><tr><td>觀音寺電梯<\/td><td>~40 THB<\/td><\/tr><tr><td>午餐<\/td><td>~80–200 THB<\/td><\/tr><tr><td>Lalita Cafe 飲料<\/td><td>~100–200 THB<\/td><\/tr><tr><td>晚餐<\/td><td>~150–300 THB<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~930–1,420 THB／人<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源（查證 2026-11-18）", "html": "<ul><li>白廟 2026 票價：<a href=\"https://www.khaosodenglish.com/tourism/2025/11/10/chiang-rais-white-temple-doubles-admission-fee-for-foreign-tourists/\" target=\"_blank\" rel=\"noopener\">Khaosod English<\/a>、<a href=\"https://thethaiger.com/hot-news/tourism/chiang-rais-white-temple-to-double-tourist-fee-in-2026\" target=\"_blank\" rel=\"noopener\">thethaiger<\/a>、<a href=\"https://www.thaiholidayguide.com/attraction/wat-rong-khun-white-temple/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://www.chiangraitimes.com/chiang-rai-guide/white-temple-chiang-rai-entrance-fee/\" target=\"_blank\" rel=\"noopener\">chiangraitimes<\/a><\/li><li>黑屋：<a href=\"https://www.thaiholidayguide.com/attraction/baan-dam-black-house/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://www.findingtheuniverse.com/the-black-temple-of-chiang-rai/\" target=\"_blank\" rel=\"noopener\">findingtheuniverse<\/a><\/li><li>藍廟：<a href=\"https://www.thaiholidayguide.com/attraction/wat-rong-suea-ten-blue-temple/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a><\/li><li>觀音寺：<a href=\"https://www.visitthailandtoday.com/temples-culture/chiang-rai/wat-huay-pla-kang\" target=\"_blank\" rel=\"noopener\">visitthailandtoday<\/a>、<a href=\"https://themanduls.com/wat-huay-pla-kang-in-chiang-rai-complete-guide/\" target=\"_blank\" rel=\"noopener\">themanduls<\/a><\/li><li>Lalita Cafe：<a href=\"https://www.visitthailandtoday.com/restaurants/chiang-rai/lalitta-cafe\" target=\"_blank\" rel=\"noopener\">visitthailandtoday<\/a>、<a href=\"https://nz.trip.com/restaurant/thailand/chiang%20rai/detail/Lalitta%20Caf%C3%A9-136460916\" target=\"_blank\" rel=\"noopener\">Trip.com<\/a><\/li><li>Mae Khachan 溫泉：<a href=\"https://www.visitthailandtoday.com/activities-tours/chiang-mai/mae-kachan-hot-spring\" target=\"_blank\" rel=\"noopener\">visitthailandtoday<\/a>、<a href=\"https://www.lovethailand.org/travel/en/2-Chiang-Rai/493-Mae-Kachan-Hot-Spring.html\" target=\"_blank\" rel=\"noopener\">lovethailand<\/a><\/li><li>長頸族村門票：<a href=\"https://www.tiqets.com/en/chiang-mai-attractions-c78479/tickets-for-long-neck-village-and-chiang-rai-temples-guided-day-tour-from-chiang-mai-with-lunch-p1104920/\" target=\"_blank\" rel=\"noopener\">Tiqets<\/a>、<a href=\"https://www.theblondtravels.com/long-neck-village\" target=\"_blank\" rel=\"noopener\">theblondtravels<\/a><\/li><li>午餐：<a href=\"https://www.visitthailandtoday.com/restaurants/chiang-rai/lanmanee-food-court\" target=\"_blank\" rel=\"noopener\">visitthailandtoday — Lanmanee Food Court<\/a><\/li><li>清邁到清萊車程：<a href=\"https://www.rome2rio.com/s/Chiang-Mai/Chiang-Rai-State\" target=\"_blank\" rel=\"noopener\">Rome2rio<\/a>、<a href=\"https://holidify.com/places/chiang-rai/how-to-reach/chiang-mai-to-chiang-rai-2137.html\" target=\"_blank\" rel=\"noopener\">holidify<\/a><\/li><\/ul>"}]}, {"n": 5, "date": "2026-11-28", "label": "11/28", "dow": "六", "title": "真心市集早午餐、下午補眠、週六夜市＋銀廟（Kingsley、雅雅、小玹）", "notes": ["動線：各自住宿 → 10:00 真心市集 → Samorn Cafe（甜點）→ 回住宿補眠 → 銀廟 Wat Sri Suphan → 週六夜市（Wua Lai 路）→ 回住宿", "🚋 可選：雅雅組傍晚去銀廟時，可以改坐<strong>清邁觀光電車<\/strong>，從夜市一帶的站（Lannatique 等）坐到「Suriwong Book Center」站（銀廟、週六夜市就在附近），單程 20 THB；Kingsley 住的 Arise 不在電車路線上", "今天的節奏：前一晚從清萊回來約 22:40，但<strong>真心市集的攤位 11:00–12:00 後就陸續收攤<\/strong>，所以今天破例 10:00 碰面（使用者已確認）；下午回去補眠", "👗 銀廟要遮住肩膀和膝蓋；<strong>女生不能進入銀色的主殿（戒堂）<\/strong>，可以在外面和其他區域參觀"], "rows": [{"time": "09:35–10:00", "start": "09:35", "end": "10:00", "icon": "🚕", "html": "雅雅組：Astra → 真心市集，Grab 門到門約 25 分 · <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;destination=Jing+Jai+Market+45+Atsadathon+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~100–150 THB"}, {"time": "09:35–10:00", "start": "09:35", "end": "10:00", "icon": "🚕", "html": "Kingsley：Arise → 真心市集，Grab 門到門約 25 分 · <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;destination=Jing+Jai+Market+45+Atsadathon+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~100–150 THB"}, {"time": "10:00–12:30", "start": "10:00", "end": "12:30", "icon": "⏰", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Jing+Jai+Market+45+Atsadathon+Rd+Pa+Tan+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">真心市集 Jing Jai Market<\/a> — 週末農夫市集，小農蔬果、手作果醬、植物染布、手工皂；旁邊的 Rustic Market 賣手工刺繡和小品牌服飾", "cost": "免費入場"}, {"time": "10:00–11:00", "start": "10:00", "end": "11:00", "icon": "🍳", "html": "早午餐就在市集吃：清邁香腸、脆皮豬、魚肚湯、麵包店的 roti（約 20 THB 起）；咖啡可以找 <strong>Roastniyom<\/strong> 或 <strong>Street Coffee Crew<\/strong> 的攤位", "cost": "~150–300 THB"}, {"time": "12:30–12:50", "start": "12:30", "end": "12:50", "icon": "🚕", "html": "3 人一台 Grab → Samorn Cafe，約 20 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Jing+Jai+Market+Chiang+Mai&amp;amp;destination=Samorn+Cafe+90+Thung+Hotel+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~100–150 THB／車"}, {"time": "12:50–14:00", "start": "12:50", "end": "14:00", "icon": "☕", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Samorn+Cafe+90+Thung+Hotel+Rd+Wat+Ket+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">Samorn Cafe（สมร คาเฟ่）<\/a> — 雅雅指定的咖啡廳，老房子改建，吃完市集正好來吃甜點；推薦藍莓起司蛋糕、提拉米蘇、抹茶麻糬起司蛋糕。不用訂位", "cost": "~150–300 THB／人"}, {"time": "14:00–14:20", "start": "14:00", "end": "14:20", "icon": "🚕", "html": "各自 Grab 回住宿：Samorn 離 Astra 和 Arise 都不遠（估計 10–15 分）· 雅雅組 <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Samorn+Cafe+90+Thung+Hotel+Rd+Chiang+Mai&amp;amp;destination=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Samorn+Cafe+90+Thung+Hotel+Rd+Chiang+Mai&amp;amp;destination=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~60–120 THB／車"}, {"time": "14:20–16:30", "start": "14:20", "end": "16:30", "icon": "😴", "html": "回住處補眠、休息", "cost": ""}, {"time": "16:30–17:00", "start": "16:30", "end": "17:00", "icon": "🚕", "html": "雅雅組：Astra → 銀廟，Grab 約 15 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;destination=Wat+Sri+Suphan+Wualai+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley：Arise → 銀廟，約 30 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;destination=Wat+Sri+Suphan+Wualai+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–200 THB"}, {"time": "17:00–17:45", "start": "17:00", "end": "17:45", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Sri+Suphan+Wualai+Rd+Hai+Ya+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">銀廟 Wat Sri Suphan<\/a> — 整座主殿用銀和鋁打造，週六晚上會點燈。男生可以付費進主殿，女生在外面看", "cost": "院區免費；主殿 50 THB（限男性）"}, {"time": "17:45–20:30", "start": "17:45", "end": "20:30", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wua+Lai+Walking+Street+Wualai+Rd+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">週六夜市 Wua Lai Walking Street<\/a> — 銀廟就在這條街上，整條 Wua Lai 路變成夜市，有銀飾、手工藝品和小吃", "cost": "免費"}, {"time": "18:30–19:30", "start": "18:30", "end": "19:30", "icon": "🍜", "html": "晚餐就在夜市邊走邊吃", "cost": "~100–250 THB"}, {"time": "20:30–21:00", "start": "20:30", "end": "21:00", "icon": "🚕", "html": "各自 Grab 回住宿（夜市人多，先走到路口再叫車）· 雅雅組 <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Wua+Lai+Walking+Street+Chiang+Mai&amp;amp;destination=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Wua+Lai+Walking+Street+Chiang+Mai&amp;amp;destination=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–200 THB／車"}], "sections": [{"title": "細節", "html": "<h4>真心市集 Jing Jai Market<\/h4><ul><li>📍 45 Atsadathon Rd, Pa Tan, Mueang Chiang Mai 50300（古城北邊）<\/li><li>🕘 農夫市集只有週六、週日早上，06:30 開始；<strong>11:00–12:00 後攤位會陸續收攤<\/strong>，比較好吃的通常上午就賣完。園區裡的咖啡廳和店家每天都有開<\/li><li>💡 不能騎機車進入園區；帶現金和環保袋<\/li><\/ul><h4>Samorn Cafe（สมร คาเฟ่）<\/h4><ul><li>📍 90 Thung Hotel Rd, Wat Ket（第一區灌溉辦公室對面）<\/li><li>🕘 每天約 08:00–18:00（也有來源寫 17:30）<\/li><li>💡 寵物友善，店狗是迷你臘腸<\/li><\/ul><h4>銀廟 Wat Sri Suphan<\/h4><ul><li>📍 Wualai Rd, Hai Ya（古城南邊）<\/li><li>🕘 平常約 06:00–17:30；<strong>週六延長到約 21:30<\/strong>，配合夜市點燈<\/li><li>🎫 院區免費；銀色主殿 50 THB，<strong>只限男性<\/strong>（依佛教傳統，女生不能進入）<\/li><li>👗 肩膀和膝蓋要遮住，入口有時可以借紗籠；進建築物要脫鞋<\/li><\/ul><h4>週六夜市 Wua Lai Walking Street<\/h4><ul><li>🕘 只有週六，約 16:00–23:00<\/li><li>💡 這條街以前是銀器工匠聚落，夜市裡有不少銀飾攤；人潮比週日夜市少一點，比較好逛<\/li><\/ul>"}, {"title": "雨天／太累的備案", "html": "<ul><li>太累的話，晚上可以只逛銀廟和夜市前段，早點回去；明天 One Nimman 和週日夜市還可以再逛<\/li><\/ul>"}, {"title": "今日花費（每人）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>交通（Grab 5 趟）<\/td><td>~280–550 THB<\/td><\/tr><tr><td>早午餐和咖啡<\/td><td>~150–300 THB<\/td><\/tr><tr><td>Samorn Cafe 甜點<\/td><td>~150–300 THB<\/td><\/tr><tr><td>銀廟主殿（男生）<\/td><td>0–50 THB<\/td><\/tr><tr><td>晚餐（夜市）<\/td><td>~100–250 THB<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~680–1,450 THB／人＋購物<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源（查證 2026-11-18）", "html": "<ul><li>真心市集：<a href=\"https://www.thaiholidayguide.com/attraction/jing-jai-market-chiang-mai/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a><\/li><li>Samorn Cafe：<a href=\"https://www.trip.com/moments/theme/poi-samorn-cafe-chiang-mai-151907797-food-993052/\" target=\"_blank\" rel=\"noopener\">Trip Moments<\/a>、<a href=\"https://www.lemon8-app.com/@poomjaii.tnp/7362106183336919553?region=us\" target=\"_blank\" rel=\"noopener\">Lemon8<\/a><\/li><li>銀廟：<a href=\"https://www.nomadotravel.app/en/attractions/wat-sri-suphan\" target=\"_blank\" rel=\"noopener\">nomadotravel<\/a>、<a href=\"https://www.thaiholidayguide.com/attraction/wat-si-suphan/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a><\/li><li>週六夜市：<a href=\"https://www.thaiholidayguide.com/attraction/chiang-mai-saturday-walking-street/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://www.nomadotravel.app/en/attractions/saturday-walking-street\" target=\"_blank\" rel=\"noopener\">nomadotravel<\/a><\/li><\/ul>"}]}, {"n": 6, "date": "2026-11-29", "label": "11/29", "dow": "日", "title": "古城寺廟、尼曼市集、週日夜市（Kingsley、雅雅、小玹）", "notes": ["動線：各自住宿 → 12:00 Maepen 海鮮午餐 → 帕辛寺 → 尼曼（Graph 咖啡 → One Nimman 市集）→ Suki Changphuak 晚餐 → 週日夜市（從帕辛寺這頭往塔佩門逛）→ 回住宿", "🚋 可選：週日夜市逛完，雅雅組可以在「塔佩門」站坐<strong>清邁觀光電車<\/strong>回夜市一帶，單程 20 THB；末班約 21:00，要趕。⚠️ 週日電車<strong>不停柴迪隆寺和帕辛寺<\/strong>這兩站（配合週日夜市封路）", "今天的節奏：中午碰面；這是三個人一起的最後一個完整晚上", "👗 帕辛寺要遮住肩膀和膝蓋，進殿要脫鞋"], "rows": [{"time": "11:40–12:00", "start": "11:40", "end": "12:00", "icon": "🚕", "html": "雅雅組：Astra → Maepen，Grab 約 20 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;destination=Maepen+Seafood+Rimping+1+Branch+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–150 THB"}, {"time": "11:30–12:00", "start": "11:30", "end": "12:00", "icon": "🚕", "html": "Kingsley：Arise → Maepen，Grab 約 20 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;destination=Maepen+Seafood+Rimping+1+Branch+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–150 THB"}, {"time": "12:00–13:15", "start": "12:00", "end": "13:15", "icon": "🦐", "html": "午餐：<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Maepen+Seafood+Rimping+1+Branch+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">Maepen Seafood（Rimping 1 店）<\/a> — 清邁在地人常去的海鮮餐廳，12:00 開門。主打<strong>蒜香炒螳螂蝦、碳烤河蝦、大隻的卵蟹<\/strong>，還有大生蠔和蛤蜊", "cost": "~400–700 THB／人（估計）"}, {"time": "13:15–13:30", "start": "13:15", "end": "13:30", "icon": "🚕", "html": "3 人一台 Grab → 帕辛寺，約 15 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Maepen+Seafood+Rimping+1+Branch+Chiang+Mai&amp;amp;destination=Wat+Phra+Singh+Woramahawihan+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–120 THB／車"}, {"time": "13:30–14:15", "start": "13:30", "end": "14:15", "icon": "⏰", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Wat+Phra+Singh+Woramahawihan+Singharat+Rd+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">帕辛寺 Wat Phra Singh<\/a> — 清邁最受尊崇的寺廟，供奉帕辛佛像；主殿 17:00 關", "cost": "院區免費；主殿約 40–50 THB"}, {"time": "14:15–14:40", "start": "14:15", "end": "14:40", "icon": "🚕", "html": "3 人一台 Grab → One Nimman，約 20 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Wat+Phra+Singh+Chiang+Mai&amp;amp;destination=One+Nimman+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–120 THB／車"}, {"time": "14:40–15:00", "start": "14:40", "end": "15:00", "icon": "☕", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Graph+One+Nimman+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">Graph One Nimman<\/a> — 清邁知名咖啡烘焙店在 One Nimman 的分店（每天約 09:00–18:00）", "cost": "~100–180 THB"}, {"time": "15:00–17:00", "start": "15:00", "end": "17:00", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=One+Nimman+Nimmanahaeminda+Rd+Soi+1+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">One Nimman White Market<\/a> — 週五到週日 15:00 開始，由住在清邁的日本人主辦，有日式小吃、手作陶器、服飾和現場音樂", "cost": "自由購物"}, {"time": "17:00–17:15", "start": "17:00", "end": "17:15", "icon": "🚕", "html": "3 人一台 Grab → Suki Changphuak（古城北門 Chang Phueak 門旁），約 15 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=One+Nimman+Chiang+Mai&amp;amp;destination=Suki+Changphuak+Mani+Nopparat+Rd+Si+Phum+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–120 THB／車"}, {"time": "17:15–18:30", "start": "17:15", "end": "18:30", "icon": "🍲", "html": "晚餐：<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Suki+Changphuak+Mani+Nopparat+Rd+Si+Phum+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">Suki Changphuak 白象壽喜燒<\/a> — 清邁在地人排隊的泰式壽喜燒老店，17:00 才開。主打<strong>泰式湯壽喜燒（suki nam）和乾炒壽喜燒（suki haeng）<\/strong>，有海鮮、豬肉、牛肉可選，配特製辣醬；價格平實。週末晚上人多，<strong>開門就到<\/strong>", "cost": "~120–250 THB／人"}, {"time": "18:30–18:45", "start": "18:30", "end": "18:45", "icon": "🚕", "html": "3 人一台 Grab → 帕辛寺門口（週日夜市西端），約 10 分（估計）· <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Suki+Changphuak+Mani+Nopparat+Rd+Si+Phum+Chiang+Mai&amp;amp;destination=Wat+Phra+Singh+Woramahawihan+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~60–100 THB／車"}, {"time": "18:45–21:00", "start": "18:45", "end": "21:00", "icon": "🎯", "html": "<a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Sunday+Walking+Street+Ratchadamnoen+Rd+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">週日夜市 Sunday Walking Street<\/a> — 從帕辛寺沿著 Ratchadamnoen 路往東逛，一路走到 <a href=\"https://www.google.com/maps/search/?api=1&amp;amp;query=Tha+Phae+Gate+Moon+Muang+Rd+Chiang+Mai\" target=\"_blank\" rel=\"noopener\">塔佩門<\/a>，全長約 1.1 km，是清邁最大的夜市；吃不夠可以再買小吃", "cost": "免費"}, {"time": "21:00–21:30", "start": "21:00", "end": "21:30", "icon": "🚕", "html": "各自 Grab 回住宿（先往外走到人少的路口再叫車）· 雅雅組 <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Tha+Phae+Gate+Chiang+Mai&amp;amp;destination=Astra+Sky+River+198+Chang+Khlan+Rd+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>；Kingsley <a href=\"https://www.google.com/maps/dir/?api=1&amp;amp;origin=Tha+Phae+Gate+Chiang+Mai&amp;amp;destination=Arise+Charoen+Mueang+Chiang+Mai&amp;amp;travelmode=driving\" target=\"_blank\" rel=\"noopener\">導航<\/a>", "cost": "~80–200 THB／車"}], "sections": [{"title": "細節", "html": "<h4>Maepen Seafood（แม่เพ็ญซีฟู้ด，Rimping 1 店）<\/h4><ul><li>📍 清邁城北、濱河一帶（Rimping 1 店；另外還有其他分店，叫車時要選 Rimping 1 Branch）<\/li><li>🕘 每天 12:00–23:00（舊資料寫 16:00 才開的是別的分店）<\/li><li>☎ 091-076-1632<\/li><\/ul><h4>Suki Changphuak（สุกี้ช้างเผือก，總店）<\/h4><ul><li>📍 Mani Nopparat Rd, Si Phum（古城北門 Chang Phueak 門、市場旁）；另有 CMU 和 Green Park 分店，叫車時要選總店<\/li><li>🕘 每天約 17:00–24:00（只開晚上）<\/li><li>☎ +66 62 942 8874<\/li><li>💡 路邊開放式的平價店，週末晚上人很多，早點到<\/li><\/ul><h4>帕辛寺 Wat Phra Singh<\/h4><ul><li>🕘 院區約 06:00–20:00；主殿約 08:00–17:00（各來源時間不一）<\/li><li>🎫 院區免費；外國人進主殿約 40 THB（也有來源寫 50 THB 或免費）<\/li><li>⚠️ 清萊也有一間同名的帕辛寺，叫車時要確認是清邁這間（Wat Phra Singh Woramahawihan）<\/li><\/ul><h4>One Nimman White Market<\/h4><ul><li>📍 Nimmanahaeminda Rd Soi 1，One Nimman 裡面<\/li><li>🕘 週五到週日 15:00–21:00；週一到週四沒有<\/li><\/ul><h4>週日夜市 Sunday Walking Street<\/h4><ul><li>🕘 每週日約 16:00–23:00（有來源寫到 22:00 或午夜）<\/li><li>⚠️ 政府公告的場次只列到 3 月，11 月是否照常沒查到官方公告；過去每週都有，出發前再確認一次<\/li><\/ul>"}, {"title": "雨天／太累的備案", "html": "<ul><li>太累的話，拿掉帕辛寺（晚上逛夜市時會從帕辛寺門口出發）<\/li><li>下雨的話，One Nimman 和 MAYA 商場都有室內空間可以待<\/li><\/ul>"}, {"title": "今日花費（每人，3 人分攤車資）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>交通（Grab 6 趟）<\/td><td>~250–450 THB<\/td><\/tr><tr><td>午餐 Maepen Seafood<\/td><td>~400–700 THB<\/td><\/tr><tr><td>帕辛寺主殿<\/td><td>0–50 THB<\/td><\/tr><tr><td>咖啡<\/td><td>~100–180 THB<\/td><\/tr><tr><td>晚餐 Suki Changphuak<\/td><td>~120–250 THB<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~870–1,630 THB／人＋購物<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源（查證 2026-11-18）", "html": "<ul><li>Maepen Seafood：<a href=\"https://www.chiangmaicitylife.com/clg/food-drink/asian-restaurants/mae-pen-seafood/\" target=\"_blank\" rel=\"noopener\">Chiang Mai Citylife<\/a>、<a href=\"https://restaurantguru.com/Maepenseafood-Fa-Ham\" target=\"_blank\" rel=\"noopener\">restaurantguru<\/a>、<a href=\"https://www.facebook.com/MaepenSeafood/\" target=\"_blank\" rel=\"noopener\">Facebook<\/a><\/li><li>Suki Changphuak：<a href=\"https://www.visitthailandtoday.com/restaurants/chiang-mai/suki-changphuak\" target=\"_blank\" rel=\"noopener\">visitthailandtoday<\/a>、<a href=\"https://maps.apple.com/place?place-id=I1D604ABFFC6BF6B\" target=\"_blank\" rel=\"noopener\">Apple Maps<\/a><\/li><li>帕辛寺：<a href=\"https://www.thaiholidayguide.com/attraction/wat-phra-singh/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://www.nomadotravel.app/en/attractions/wat-phra-singh\" target=\"_blank\" rel=\"noopener\">nomadotravel<\/a>、<a href=\"https://audiala.com/en/thailand/chiang-mai/wat-phra-sing/\" target=\"_blank\" rel=\"noopener\">audiala<\/a><\/li><li>Graph One Nimman：<a href=\"https://tablejourney.com/thailand/chiang-mai/cafes/sunday/\" target=\"_blank\" rel=\"noopener\">tablejourney<\/a><\/li>< 不受影響<\/li><\/ul>"}, {"title": "今日花費（每人）", "html": "<div class='tbl'><table><thead><tr><th>項目<\/th><th>金額<\/th><\/tr><\/thead><tbody><tr><td>交通（Grab 3 趟，2 人分攤）<\/td><td>~110–190 THB<\/td><\/tr><tr><td>午餐<\/td><td>~80–150 THB<\/td><\/tr><tr><td>Makkha 按摩 2 小時<\/td><td>~1,700–2,800 THB（估計，依項目）<\/td><\/tr><tr><td>晚餐 Ekachan<\/td><td>~400–800 THB<\/td><\/tr><tr><td><strong>小計<\/strong><\/td><td><strong>~2,290–3,940 THB／人＋伴手禮<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "來源（查證 2026-11-18）", "html": "<ul><li>清邁觀光電車：<a href=\"https://viachiangmai.com/blog/chiang-mai-tram/\" target=\"_blank\" rel=\"noopener\">viachiangmai<\/a>、<a href=\"https://www.nationthailand.com/news/tourism/40073660\" target=\"_blank\" rel=\"noopener\">Nation Thailand<\/a>、<a href=\"https://visionthai.net/article/chiang-mai-electric-tram-launch/\" target=\"_blank\" rel=\"noopener\">Vision Thai 看見泰國<\/a>（查證 2026-11-20）<\/li><li>瓦洛洛市場：<a href=\"https://www.timeout.com/chiang-mai/attractions/warorot-market\" target=\"_blank\" rel=\"noopener\">Time Out<\/a>、<a href=\"https://www.thaiholidayguide.com/attraction/warorot-market/\" target=\"_blank\" rel=\"noopener\">thaiholidayguide<\/a>、<a href=\"https://www.trvlogue.com/en/chiang-mai-warorot-market-guide\" target=\"_blank\" rel=\"noopener\">trvlogue<\/a><\/li><li>Makkha Health &amp; Spa：<a href=\"https://www.makkhahealthandspa.com/makkha-chiangmai-spa/\" target=\"_blank\" rel=\"noopener\">官網分店資訊<\/a>、<a href=\"https://www.pelago.com/en-US/activity/pzh2ddyuy-makkha-health-and-spa-chiang-mai-night-bazaar-chiang-mai/\" target=\"_blank\" rel=\"noopener\">Pelago<\/a>、<a href=\"https://www.klook.com/en-GB/activity/74964-makkha-health-spa-experience-chiang-mai/\" target=\"_blank\" rel=\"noopener\">Klook<\/a><\/li><li>Ekachan：<a href=\"https://www.timeout.com/chiang-mai/restaurants/ekachan-the-wisdom-of-ethnic-thai-cuisine\" target=\"_blank\" rel=\"noopener\">Time Out<\/a>、<a href=\"https://www.koktailmagazine.com/restaurant/ekachan-the-wisdom-of-ethnic-thai-cuisine/\" target=\"_blank\" rel=\"noopener\">Koktail<\/a>、<a href=\"https://www.trip.com/restaurant/thailand/chiang-mai/detail/ekachan-the-wisdom-of-ethnic-thai-cuisine-136571830/\" target=\"_blank\" rel=\"noopener\">Trip.com<\/a><\/li><li>機場報到時間：<a href=\"https://us.trip.com/flights/status/cnx/\" target=\"_blank\" rel=\"noopener\">Trip.com<\/a>、<a href=\"https://flightqueue.com/airport/CNX\" target=\"_blank\" rel=\"noopener\">flightqueue<\/a><\/li><li>台灣肉製品禁令：<a href=\"https://www.immigration.gov.tw/5382/5385/7229/7232/413538\" target=\"_blank\" rel=\"noopener\">移民署<\/a>、<a href=\"https://www.cna.com.tw/news/firstnews/201812195004.aspx\" target=\"_blank\" rel=\"noopener\">中央社<\/a><\/li><\/ul>"}]}]};
const TZ = "+07:00";
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

/* theme toggle */
(function(){
  const saved = store.get("cm-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  const btn = $("#themeBtn");
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const sync = () => btn.textContent = isDark() ? "☀️" : "🌙";
  sync();
  btn.onclick = () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("cm-theme", t); sync(); };
})();

/* lanterns */
(function(){
  const box = $("#lanterns");
  for (let i = 0; i < 9; i++) {
    const l = document.createElement("span");
    l.className = "lantern";
    l.style.setProperty("--x", (6 + i * 11 + Math.random() * 5) + "%");
    l.style.setProperty("--y", (10 + Math.random() * 60) + "%");
    l.style.setProperty("--s", (14 + Math.random() * 16) + "px");
    l.style.setProperty("--d", (16 + Math.random() * 14) + "s");
    l.style.setProperty("--delay", (-Math.random() * 20) + "s");
    box.appendChild(l);
  }
})();

/* time helpers */
const at = (date, hm) => new Date(`${date}T${hm}:00${TZ}`);
const rowsAll = [];
TRIP.days.forEach(d => d.rows.forEach((r, i) => {
  if (!r.start) return;
  const s = at(d.date, r.start);
  let e = r.end ? at(d.date, r.end) : null;
  if (e && e < s) e = new Date(e.getTime() + 864e5);
  rowsAll.push({ day: d, idx: i, s, e: e || new Date(s.getTime() + 15 * 6e4), r });
}));
const tripStart = rowsAll[0].s, tripEnd = rowsAll[rowsAll.length - 1].e;
const now = new Date();
const todayStr = new Date(now.getTime() + 7 * 3600e3).toISOString().slice(0, 10);
const plain = h => { const t = document.createElement("div"); t.innerHTML = h; return t.textContent.replace(/\s*·\s*導航.*$/, "").trim(); };

/* chips */
(function(){
  const c = $("#chips");
  let count;
  if (now < tripStart) count = `還有 ${Math.ceil((tripStart - now) / 864e5)} 天出發`;
  else if (now <= tripEnd) { const d = TRIP.days.find(x => x.date === todayStr); count = d ? `旅程中・Day ${d.n}` : "旅程中"; }
  else count = "旅程結束 🎉";
  c.innerHTML = `<span class="chip count">🏮 ${count}</span><span class="chip">👥 Kingsley・毛毛・雅雅・小玹</span><span class="chip">💱 泰銖 THB</span>`;
})();

/* now / next */
(function(){
  if (now < new Date(tripStart.getTime() - 6 * 3600e3) || now > tripEnd) return;
  const cur = rowsAll.find(x => x.s <= now && now < x.e);
  const next = rowsAll.find(x => x.s > now);
  const fmt = x => `<div class="row"><span class="t">${x.r.start}</span><span>${plain(x.r.html)}</span></div>`;
  const el = $("#now");
  el.innerHTML = `<div class="box"><h3>🏮 現在 ・ 下一站</h3>${cur ? `<div class="row"><span class="lbl">現在</span></div>${fmt(cur)}` : ""}${next ? `<div class="row"><span class="lbl">下一站</span></div>${fmt(next)}` : ""}</div>`;
  el.hidden = false;
})();

/* tabs & panels */
const tabs = $("#tabs"), panels = $("#panels");
function addTab(id, label, sub, today){
  const b = document.createElement("button");
  b.className = "tab" + (today ? " today" : "");
  b.role = "tab"; b.id = "t-" + id; b.setAttribute("aria-controls", "p-" + id);
  b.innerHTML = `${label}${sub ? `<small>${sub}</small>` : ""}`;
  b.onclick = () => select(id, true);
  tabs.appendChild(b);
}
function select(id, scroll){
  tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.id === "t-" + id));
  panels.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-" + id);
  const t = $("#t-" + id); t && t.scrollIntoView({ inline: "center", block: "nearest" });
  if (scroll) window.scrollTo({ top: $(".tabs").offsetTop - 2, behavior: "smooth" });
  store.set("cm-tab", id);
}
function decorate(root){
  root.querySelectorAll("a[href*='google.com/maps']").forEach(a => {
    if (a.textContent.trim() === "導航") { a.className = "navbtn"; a.textContent = "🧭 導航"; }
    else if (a.href.includes("/maps/search/")) a.className = "place";
  });
}

/* overview panel */
(function(){
  addTab("ov", "總覽", "待辦");
  const p = document.createElement("div");
  p.className = "panel"; p.id = "p-ov"; p.setAttribute("role", "tabpanel");
  const meta = TRIP.meta.map(m => `<div class="callout">${m}</div>`).join("");
  const days = TRIP.overview.rows.map((r, i) => `<button class="dcard" data-day="${i + 1}">
      <span class="d"><b>${r[0]}</b><span>${r[1]}</span></span>
      <span><span class="who">👥 ${r[2]}</span><br><span class="main">${r[3]}</span></span></button>`).join("");
  const done = JSON.parse(store.get("cm-check") || "{}");
  const check = TRIP.checklist.map((g, gi) => `<div class="${g.level}"><h4>${g.title}</h4>${g.items.map((it, ii) => {
      const k = gi + "-" + ii;
      return `<label class="${done[k] ? "done" : ""}"><input type="checkbox" data-k="${k}" ${done[k] ? "checked" : ""}><span>${it}</span></label>`;
    }).join("")}</div>`).join("");
  const notes = TRIP.notes.map(n => `<details><summary>${n.title}</summary>${n.html}</details>`).join("");
  p.innerHTML = `${meta}<section class="card"><h3>📅 每天在做什麼</h3><div class="days">${days}</div></section>
    <section class="card check"><h3>✅ 出發前要處理</h3>${check}</section>
    <section class="card">${notes}</section>`;
  p.querySelectorAll(".dcard").forEach(b => b.onclick = () => select("d" + b.dataset.day, true));
  p.querySelectorAll(".check input").forEach(cb => cb.onchange = () => {
    done[cb.dataset.k] = cb.checked; cb.parentElement.classList.toggle("done", cb.checked);
    store.set("cm-check", JSON.stringify(done));
  });
  decorate(p);
  panels.appendChild(p);
})();

/* day panels */
TRIP.days.forEach(d => {
  addTab("d" + d.n, `Day ${d.n}`, `${d.label}（${d.dow}）`, d.date === todayStr);
  const p = document.createElement("div");
  p.className = "panel"; p.id = "p-d" + d.n; p.setAttribute("role", "tabpanel"); p.hidden = true;
  const items = d.rows.map((r, i) => {
    const cls = [r.icon.includes("🔒") ? "lock" : "", r.icon.includes("⏰") ? "limit" : ""];
    const hit = rowsAll.find(x => x.day === d && x.idx === i);
    if (hit) { if (hit.s <= now && now < hit.e) cls.push("current"); else if (hit.e <= now) cls.push("past"); }
    const t = r.start ? `<b>${r.start}</b>${r.end ? r.end : ""}` : r.time;
    return `<li class="${cls.join(" ")}"><div class="time">${t}</div><span class="dot"></span>
      <div class="body"><span class="ic">${r.icon}</span>${r.html}${r.cost ? `<br><span class="cost">💰 ${r.cost}</span>` : ""}</div></li>`;
  }).join("");
  const secs = d.sections.map(s => `<details ${/花費/.test(s.title) ? "open" : ""}><summary>${s.title}</summary>${s.html}</details>`).join("");
  p.innerHTML = `<h2 class="dh">Day ${d.n}｜${d.title}</h2><p class="dmeta">${d.label}（${d.dow}）</p>
    ${d.notes.map(n => `<div class="callout">${n}</div>`).join("")}
    <ol class="tl">${items}</ol><section class="card">${secs}</section>`;
  decorate(p);
  panels.appendChild(p);
});

/* initial tab: today during trip, else last viewed, else overview */
const todayDay = TRIP.days.find(x => x.date === todayStr);
select(todayDay ? "d" + todayDay.n : (store.get("cm-tab") && $("#t-" + store.get("cm-tab")) ? store.get("cm-tab") : "ov"), false);
const cur = $(".tl li.current"); if (cur) setTimeout(() => cur.scrollIntoView({ block: "center" }), 300);
</script>
</body>
</html>
