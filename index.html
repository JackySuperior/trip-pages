<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行行程</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2a2233;--ink2:#6b6177;--line:#e7dccb;--accent:#d9731f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14112b;--card:#221d42;--ink:#f4ecdf;--ink2:#b4a9c6;--line:#352e5c;--accent:#f0953f}}
:root[data-theme="dark"]{--bg:#14112b;--card:#221d42;--ink:#f4ecdf;--ink2:#b4a9c6;--line:#352e5c;--accent:#f0953f}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 20px}
a.trip{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--ink);text-decoration:none;margin-bottom:12px}
a.trip b{color:var(--accent);font-size:18px}
a.trip span{display:block;color:var(--ink2);font-size:14px}
</style>
</head>
<body>
<main>
<h1>🧳 旅行行程</h1>
<a class="trip" href="2026-11-chiangmai/"><b>🏮 清邁・天燈之旅</b><span>2026-11-24 ～ 11-30｜水燈節、CAD 天燈節、清萊三廟、週末市集</span></a>
</main>
</body>
</html>
